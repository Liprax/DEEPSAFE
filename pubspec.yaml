name: deepsafe
description: DeepSafe - Güvenli Dosya Yöneticisi
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Ayarlar (desen, tuz kaydetme)
  shared_preferences: ^2.2.2

  # Veritabanı (Notlar)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+2
  sqlite3_flutter_libs: ^0.5.18

  # Dosya yolları
  path_provider: ^2.1.2
  path: ^1.9.0

  # Şifreleme
  crypto: ^3.0.3
  cryptography: ^2.9.0

  # Not editörü
  fleather: ^1.12.0

  # UI
  cupertino_icons: ^1.0.6
  qr_flutter: ^4.1.0

  # Network & Server
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  shelf_multipart: ^2.0.1
  network_info_plus: ^6.0.0
  mime: ^1.0.4
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/

